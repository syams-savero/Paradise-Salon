[build]
  command = "npm run build"
  publish = "out"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/api-admin"
  status = 200
  force = true

[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"

[[redirects]]
  from = "/uploads/*"
  to = "/uploads/:splat"

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://images.unsplash.com https://upload.wikimedia.org https://www.instagram.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://www.google.com; connect-src 'self' https://api.whatsapp.com https://wa.me; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=604800, immutable"
    Content-Security-Policy = "default-src 'none'; img-src 'self'; sandbox"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"